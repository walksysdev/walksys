    <link rel="icon" type="image/png" href="https://cdn.discordapp.com/embed/avatars/0.png">

    <style>
      :root {
        --bg-color: #0a0a0a;
      }
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background-color: var(--bg-color);
        position: fixed; /* يمنع الـ Bounce effect في الموبايل */
        overflow-y: auto;
        -webkit-overflow-scrolling: touch;
      }
      body {
        font-family: 'Inter', sans-serif;
        color: #ffffff;
      }
      #root {
        width: 100%;
        min-height: 100%;
        overflow-x: hidden;
        position: relative;
      }
      #root:empty::before {
        content: 'Hog is waking up...';
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        font-family: 'Fira+Code', monospace;
        text-transform: uppercase;
        letter-spacing: 0.5em;
        font-size: 10px;
        opacity: 0.5;
        animation: pulse 2s infinite;
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.2; }
        50% { opacity: 0.6; }
      }
      .font-mono { font-family: 'Fira+Code', monospace; }
      .font-arabic { font-family: 'Cairo', sans-serif; }
      .grainy {
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        pointer-events: none; z-index: 50; opacity: 0.04;
        background-image: url("https://grainy-gradients.vercel.app/noise.svg");
      }
      .glass {
        background: rgba(255, 255, 255, 0.03);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      .custom-scroll::-webkit-scrollbar { width: 4px; height: 4px; }
      .custom-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.1); border-radius: 10px; }
      
      /* منع أي عنصر من الهروب خارج الحدود بسبب الـ 3D Tilt */
      * {
        box-sizing: border-box;
      }
    </style>
